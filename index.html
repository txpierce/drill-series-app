<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Baseball Practice Drill Series</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
  <div class="max-w-4xl mx-auto p-4 sm:p-6">
    <!-- Header & Interactive Segment Timer -->
    <header class="bg-slate-900 border border-slate-800 text-white p-6 rounded-2xl shadow-xl mb-6">
      <div class="flex flex-col md:flex-row items-center justify-between gap-6">
        <div>
          <h1 class="text-2xl sm:text-3xl font-extrabold tracking-tight flex items-center gap-2">
            <span>⚾</span> Practice Drill Series Tracker
          </h1>
          <p class="text-slate-400 text-sm mt-1">Manage practice flow, auto-advancing drills, and rotation-reset BP timers.</p>
        </div>

        <!-- Practice Segment Timer Box (Drills) -->
        <div id="drill-timer-box" class="bg-slate-950/80 border border-slate-800 p-4 rounded-xl flex flex-col items-center shadow-inner min-w-[300px]">
          <div class="text-xs uppercase tracking-wider text-emerald-400 font-bold mb-1" id="timer-title">Drill 1 Segment Timer</div>
          <div class="text-4xl font-mono font-black text-white tracking-widest my-1" id="timer-display">05:00</div>
          
          <div class="flex items-center gap-2 my-2 text-xs text-slate-300">
            <span>Segment Length:</span>
            <input type="number" id="segment-length-input" value="5" min="1" max="60" onchange="updateSegmentLength(this.value)" class="w-14 bg-slate-900 border border-slate-700 text-center font-bold text-white rounded px-1.5 py-0.5 focus:outline-none focus:border-emerald-500">
            <span>mins</span>
          </div>

          <div class="flex items-center gap-2 mt-1 w-full justify-center">
            <button onclick="adjustTime(-1)" class="bg-slate-800 hover:bg-slate-700 text-xs px-2.5 py-1 rounded font-semibold text-slate-300">-1m</button>
            <button onclick="toggleTimer()" id="start-pause-btn" class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold px-4 py-1.5 rounded-lg shadow transition">Start</button>
            <button onclick="resetTimer()" class="bg-slate-800 hover:bg-slate-700 text-xs px-2.5 py-1 rounded font-semibold text-slate-300">Reset</button>
            <button onclick="adjustTime(1)" class="bg-slate-800 hover:bg-slate-700 text-xs px-2.5 py-1 rounded font-semibold text-slate-300">+1m</button>
          </div>
          
          <div class="flex items-center justify-between w-full mt-3 pt-2 border-t border-slate-800/80 text-xs text-slate-400">
            <button onclick="changeDrillSegment(-1)" class="hover:text-white">&larr; Prev Drill</button>
            <span id="current-drill-indicator" class="font-semibold text-slate-200">Segment 1 of 12</span>
            <button onclick="changeDrillSegment(1)" class="hover:text-white">Next Drill &rarr;</button>
          </div>
        </div>

        <!-- Batting Practice Timer Box (Hidden by default) -->
        <div id="bp-timer-box" class="hidden bg-slate-950/80 border border-amber-500/50 p-4 rounded-xl flex flex-col items-center shadow-inner min-w-[300px]">
          <div class="text-xs uppercase tracking-wider text-amber-400 font-bold mb-1">Batting Practice Timer</div>
          <div class="text-3xl font-mono font-black text-amber-300 tracking-widest my-1" id="bp-group-display">20:00</div>
          <div class="text-xs text-slate-400">Group Time Remaining</div>
          
          <div class="text-xl font-mono font-bold text-white tracking-wider mt-2" id="bp-rotation-display">05:00</div>
          <div class="text-xs text-amber-400/80 font-semibold">Rotation Time (Resets both when finished)</div>

          <!-- BP Settings -->
          <div class="grid grid-cols-2 gap-2 my-2 text-xs text-slate-300 w-full pt-2 border-t border-slate-800">
            <div class="flex flex-col items-center">
              <span>Group Mins:</span>
              <input type="number" id="bp-group-input" value="20" min="1" max="120" onchange="updateBPSettings()" class="w-14 bg-slate-900 border border-slate-700 text-center font-bold text-white rounded px-1.5 py-0.5 mt-1">
            </div>
            <div class="flex flex-col items-center">
              <span>Rotation Mins:</span>
              <input type="number" id="bp-rotation-input" value="5" min="1" max="60" onchange="updateBPSettings()" class="w-14 bg-slate-900 border border-slate-700 text-center font-bold text-white rounded px-1.5 py-0.5 mt-1">
            </div>
          </div>

          <div class="flex items-center gap-2 mt-2 w-full justify-center">
            <button onclick="toggleBPTimer()" id="bp-start-pause-btn" class="bg-amber-600 hover:bg-amber-500 text-white text-xs font-bold px-5 py-1.5 rounded-lg shadow transition">Start BP</button>
            <button onclick="resetBPTimer()" class="bg-slate-800 hover:bg-slate-700 text-xs px-3 py-1.5 rounded font-semibold text-slate-300">Reset</button>
          </div>
        </div>
      </div>
    </header>

    <!-- Filter Buttons (Tabs) -->
    <div class="flex flex-wrap gap-2 mb-6">
      <button onclick="switchTab('All')" class="filter-btn bg-emerald-600 text-white px-4 py-2 rounded-xl text-sm font-semibold shadow hover:bg-emerald-500 transition">All Drills</button>
      <button onclick="switchTab('Pitching Coach')" class="filter-btn bg-slate-900 text-slate-300 border border-slate-800 px-4 py-2 rounded-xl text-sm font-semibold shadow-sm hover:bg-slate-800 transition">Pitching Coach</button>
      <button onclick="switchTab('Catching Coach')" class="filter-btn bg-slate-900 text-slate-300 border border-slate-800 px-4 py-2 rounded-xl text-sm font-semibold shadow-sm hover:bg-slate-800 transition">Catching Coach</button>
      <button onclick="switchTab('Infield Coach')" class="filter-btn bg-slate-900 text-slate-300 border border-slate-800 px-4 py-2 rounded-xl text-sm font-semibold shadow-sm hover:bg-slate-800 transition">Infield Coach</button>
      <button onclick="switchTab('Outfield')" class="filter-btn bg-slate-900 text-slate-300 border border-slate-800 px-4 py-2 rounded-xl text-sm font-semibold shadow-sm hover:bg-slate-800 transition">Outfield</button>
      <button onclick="switchTab('Batting Practice')" class="filter-btn bg-slate-900 text-amber-400 border border-amber-900/50 px-4 py-2 rounded-xl text-sm font-semibold shadow-sm hover:bg-slate-800 transition">Batting Practice</button>
    </div>

    <!-- Main Container -->
    <div id="main-container" class="space-y-4">
      <!-- Dynamically populated -->
    </div>
  </div>

  <script>
    let originalDrills = [];
    let timerInterval = null;
    let customSegmentMins = 5;
    let totalSeconds = 300; 
    let isRunning = false;
    let currentActiveIndex = 0; 
    let audioCtx = null;
    let currentTab = 'All';

    // BP Timer Variables
    let bpGroupSeconds = 20 * 60;
    let bpRotationSeconds = 5 * 60;
    let bpInterval = null;
    let bpIsRunning = false;

    function playAlertSound(type = 'warning') {
      try {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }

        if (type === 'warning') {
          let now = audioCtx.currentTime;
          for (let i = 0; i < 4; i++) {
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.type = 'square';
            osc.frequency.setValueAtTime(987.77, now + (i * 0.22));
            gain.gain.setValueAtTime(0.9, now + (i * 0.22));
            gain.gain.exponentialRampToValueAtTime(0.0001, now + (i * 0.22) + 0.16);
            osc.start(now + (i * 0.22));
            osc.stop(now + (i * 0.22) + 0.16);
          }
        } else {
          let now = audioCtx.currentTime;
          for (let i = 0; i < 2; i++) {
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(1318.51, now + (i * 0.3));
            gain.gain.setValueAtTime(0.9, now + (i * 0.3));
            gain.gain.exponentialRampToValueAtTime(0.0001, now + (i * 0.3) + 0.4);
            osc.start(now + (i * 0.3));
            osc.stop(now + (i * 0.3) + 0.4);
          }
        }
      } catch (e) {
        console.log("Audio play error:", e);
      }
    }

    async function loadData() {
      const response = await fetch('data.json');
      const data = await response.json();
      originalDrills = data.drills.map((d, index) => ({ ...d, originalIndex: index }));
      renderContent();
      updateTimerDisplay();
      updateBPDisplay();
    }

    function getOrderedDrills() {
      let ordered = [];
      for (let i = 0; i < originalDrills.length; i++) {
        let idx = (currentActiveIndex + i) % originalDrills.length;
        ordered.push(originalDrills[idx]);
      }
      return ordered;
    }

    function renderContent() {
      const container = document.getElementById('main-container');
      container.innerHTML = '';

      if (currentTab === 'Batting Practice') {
        container.innerHTML = `
          <div class="bg-slate-900 border border-amber-500/30 rounded-2xl shadow-lg p-6 text-slate-200">
            <h2 class="text-xl font-bold text-amber-400 mb-2 flex items-center gap-2"><span>🏏</span> Batting Practice Group & Rotation Manager</h2>
            <p class="text-slate-400 text-sm mb-6">Group timer runs first, followed by rotation timer. When the rotation timer runs out, both timers reset automatically.</p>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
              <div class="bg-slate-950 p-5 rounded-xl border border-slate-800">
                <h3 class="font-bold text-slate-200 mb-2">BP Functionality:</h3>
                <ul class="text-sm text-slate-400 space-y-2 list-disc pl-4">
                  <li>Group Timer counts down first.</li>
                  <li>Rotation Timer counts down only after Group Timer hits 00:00.</li>
                  <li>When Rotation Timer hits 00:00, both timers trigger an alert and reset back to entered values.</li>
                </ul>
              </div>
              <div class="bg-slate-950 p-5 rounded-xl border border-slate-800 flex flex-col justify-center items-center text-center">
                <span class="text-3xl mb-2">⏱️</span>
                <div class="text-sm font-semibold text-slate-300">Status: <span id="bp-status-text" class="text-amber-400">Ready</span></div>
                <p class="text-xs text-slate-500 mt-1">Hit "Start BP" in the top right box to begin.</p>
              </div>
            </div>
          </div>
        `;
        return;
      }

      const orderedDrills = getOrderedDrills();

      orderedDrills.forEach((drillBlock, listPosition) => {
        const filteredTasks = drillBlock.tasks.filter(t => {
          if (currentTab === 'All') return true;
          return t.coach.toLowerCase().includes(currentTab.toLowerCase());
        });

        if (filteredTasks.length === 0) return;

        const isActive = (listPosition === 0);

        const card = document.createElement('div');
        card.className = `bg-slate-900 border rounded-2xl shadow-lg p-5 transition ${isActive ? 'border-emerald-500 ring-2 ring-emerald-500/40 bg-slate-900/90' : 'border-slate-800 opacity-75'}`;

        let tasksHtml = filteredTasks.map((t, idx) => `
          <div class="flex items-start justify-between py-3.5 ${idx !== filteredTasks.length - 1 ? 'border-b border-slate-800' : ''}">
            <div class="flex items-start space-x-3.5 w-full">
              <input type="checkbox" class="mt-1 h-5 w-5 rounded border-slate-700 bg-slate-800 text-emerald-500 focus:ring-emerald-500 cursor-pointer">
              <div class="flex-1">
                <div class="flex flex-wrap items-center justify-between gap-2">
                  <div class="flex items-center space-x-2">
                    <span class="bg-slate-800 text-slate-300 border border-slate-700 text-xs font-bold px-2.5 py-0.5 rounded-md">${t.position}</span>
                    <span class="text-xs text-emerald-400 font-semibold">Lead: ${t.coach}</span>
                  </div>
                  <span class="bg-slate-800/80 text-amber-400 border border-slate-700/60 text-xs font-mono font-bold px-2.5 py-0.5 rounded-md">
                    ⏱️ ${customSegmentMins} mins
                  </span>
                </div>
                <h4 class="font-semibold text-slate-100 mt-1.5">${t.drill}</h4>
                <p class="text-sm text-slate-400 mt-0.5 leading-relaxed">${t.description}</p>
              </div>
            </div>
          </div>
        `).join('');

        card.innerHTML = `
          <div class="flex items-center justify-between mb-3 pb-2.5 border-b border-slate-800 cursor-pointer" onclick="jumpToDrill(${drillBlock.originalIndex})">
            <h3 class="text-lg font-bold ${isActive ? 'text-emerald-400' : 'text-slate-300'} tracking-wide">
              Drill ${drillBlock.drillNumber} ${isActive ? '⭐ (ACTIVE SEGMENT)' : ''}
            </h3>
            <span class="text-xs text-slate-400 hover:text-white">Click to make active</span>
          </div>
          <div class="divide-y divide-slate-800">
            ${tasksHtml}
          </div>
        `;
        container.appendChild(card);
      });
    }

    function switchTab(tabName) {
      currentTab = tabName;
      document.querySelectorAll('.filter-btn').forEach(btn => {
        let matches = btn.textContent.includes(tabName) || (tabName === 'All' && btn.textContent === 'All Drills');
        if(matches) {
          btn.className = `filter-btn ${tabName === 'Batting Practice' ? 'bg-amber-600 text-white' : 'bg-emerald-600 text-white'} px-4 py-2 rounded-xl text-sm font-semibold shadow transition`;
        } else {
          btn.className = `filter-btn bg-slate-900 ${btn.textContent.includes('Batting Practice') ? 'text-amber-400 border border-amber-900/50' : 'text-slate-300 border border-slate-800'} px-4 py-2 rounded-xl text-sm font-semibold shadow-sm hover:bg-slate-800 transition`;
        }
      });

      const drillTimerBox = document.getElementById('drill-timer-box');
      const bpTimerBox = document.getElementById('bp-timer-box');

      if (tabName === 'Batting Practice') {
        drillTimerBox.classList.add('hidden');
        bpTimerBox.classList.remove('hidden');
      } else {
        drillTimerBox.classList.remove('hidden');
        bpTimerBox.classList.add('hidden');
      }

      renderContent();
    }

    function updateTimerDisplay() {
      const minutes = Math.floor(totalSeconds / 60);
      const seconds = totalSeconds % 60;
      const displayElem = document.getElementById('timer-display');
      displayElem.textContent = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
      
      if (totalSeconds <= 10 && totalSeconds > 0) {
        displayElem.className = 'text-4xl font-mono font-black text-rose-500 tracking-widest my-1 animate-pulse';
      } else {
        displayElem.className = 'text-4xl font-mono font-black text-white tracking-widest my-1';
      }

      if(originalDrills.length > 0) {
        const activeDrill = getOrderedDrills()[0];
        document.getElementById('timer-title').textContent = `Drill ${activeDrill.drillNumber} Segment Timer`;
        document.getElementById('current-drill-indicator').textContent = `Segment ${(currentActiveIndex % originalDrills.length) + 1} of ${originalDrills.length}`;
      }
    }

    function updateSegmentLength(val) {
      let parsed = parseInt(val);
      if (isNaN(parsed) || parsed < 1) parsed = 1;
      customSegmentMins = parsed;
      totalSeconds = customSegmentMins * 60;
      updateTimerDisplay();
      renderContent();
    }

    // --- BP Timer Functions ---
    function updateBPDisplay() {
      const gMins = Math.floor(bpGroupSeconds / 60);
      const gSecs = bpGroupSeconds % 60;
      document.getElementById('bp-group-display').textContent = `${String(gMins).padStart(2, '0')}:${String(gSecs).padStart(2, '0')}`;

      const rMins = Math.floor(bpRotationSeconds / 60);
      const rSecs = bpRotationSeconds % 60;
      const rDisplay = document.getElementById('bp-rotation-display');
      rDisplay.textContent = `${String(rMins).padStart(2, '0')}:${String(rSecs).padStart(2, '0')}`;

      if (bpRotationSeconds <= 10 && bpRotationSeconds > 0 && bpIsRunning && bpGroupSeconds <= 0) {
        rDisplay.className = 'text-xl font-mono font-bold text-rose-500 tracking-wider mt-2 animate-pulse';
      } else {
        rDisplay.className = 'text-xl font-mono font-bold text-white tracking-wider mt-2';
      }
    }

    function updateBPSettings() {
      let gInput = parseInt(document.getElementById('bp-group-input').value);
      let rInput = parseInt(document.getElementById('bp-rotation-input').value);
      
      if (!isNaN(gInput) && gInput > 0) bpGroupSeconds = gInput * 60;
      if (!isNaN(rInput) && rInput > 0) bpRotationSeconds = rInput * 60;
      updateBPDisplay();
    }

    function toggleBPTimer() {
      const btn = document.getElementById('bp-start-pause-btn');
      const statusText = document.getElementById('bp-status-text');

      if (bpIsRunning) {
        clearInterval(bpInterval);
        bpIsRunning = false;
        btn.textContent = 'Start BP';
        btn.className = 'bg-amber-600 hover:bg-amber-500 text-white text-xs font-bold px-5 py-1.5 rounded-lg shadow transition';
        if(statusText) statusText.textContent = 'Paused';
      } else {
        bpIsRunning = true;
        btn.textContent = 'Pause BP';
        btn.className = 'bg-rose-600 hover:bg-rose-500 text-white text-xs font-bold px-5 py-1.5 rounded-lg shadow transition';
        if(statusText) statusText.textContent = bpGroupSeconds > 0 ? 'Group Running' : 'Rotation Running';

        bpInterval = setInterval(() => {
          let gInputMins = parseInt(document.getElementById('bp-group-input').value) || 20;
          let rInputMins = parseInt(document.getElementById('bp-rotation-input').value) || 5;

          if (bpGroupSeconds > 0) {
            bpGroupSeconds--;
            if (bpGroupSeconds === 10) playAlertSound('warning');
            if (bpGroupSeconds === 0) {
              playAlertSound('complete');
            }
          } else {
            // Group time is done, now run rotation timer
            if(statusText) statusText.textContent = 'Rotation Running';
            if (bpRotationSeconds > 0) {
              bpRotationSeconds--;
              if (bpRotationSeconds === 10) playAlertSound('warning');
            } else {
              // Rotation Timer Finished -> Trigger alert and reset BOTH timers back to entered values
              playAlertSound('complete');
              clearInterval(bpInterval);
              bpIsRunning = false;
              btn.textContent = 'Start BP';
              btn.className = 'bg-amber-600 hover:bg-amber-500 text-white text-xs font-bold px-5 py-1.5 rounded-lg shadow transition';
              if(statusText) statusText.textContent = 'Completed & Reset';
              
              bpGroupSeconds = gInputMins * 60;
              bpRotationSeconds = rInputMins * 60;
              alert('Rotation Time Completed! Both timers have been reset.');
            }
          }
          updateBPDisplay();
        }, 1000);
      }
    }

    function resetBPTimer() {
      clearInterval(bpInterval);
      bpIsRunning = false;
      let gInput = parseInt(document.getElementById('bp-group-input').value) || 20;
      let rInput = parseInt(document.getElementById('bp-rotation-input').value) || 5;
      bpGroupSeconds = gInput * 60;
      bpRotationSeconds = rInput * 60;

      document.getElementById('bp-start-pause-btn').textContent = 'Start BP';
      document.getElementById('bp-start-pause-btn').className = 'bg-amber-600 hover:bg-amber-500 text-white text-xs font-bold px-5 py-1.5 rounded-lg shadow transition';
      const statusText = document.getElementById('bp-status-text');
      if(statusText) statusText.textContent = 'Ready';
      updateBPDisplay();
    }

    // --- Drill Timer Functions ---
    function toggleTimer() {
      const btn = document.getElementById('start-pause-btn');
      if (isRunning) {
        clearInterval(timerInterval);
        isRunning = false;
        btn.textContent = 'Start';
        btn.className = 'bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold px-4 py-1.5 rounded-lg shadow transition';
      } else {
        isRunning = true;
        btn.textContent = 'Pause';
        btn.className = 'bg-amber-600 hover:bg-amber-500 text-white text-xs font-bold px-4 py-1.5 rounded-lg shadow transition';
        timerInterval = setInterval(() => {
          if (totalSeconds > 0) {
            totalSeconds--;
            if (totalSeconds === 10) playAlertSound('warning');
            updateTimerDisplay();
          } else {
            playAlertSound('complete');
            advanceToNextSegment();
          }
        }, 1000);
      }
    }

    function advanceToNextSegment() {
      currentActiveIndex++;
      if (currentActiveIndex >= originalDrills.length) {
        clearInterval(timerInterval);
        isRunning = false;
        currentActiveIndex = 0;
        document.getElementById('start-pause-btn').textContent = 'Start';
        document.getElementById('start-pause-btn').className = 'bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold px-4 py-1.5 rounded-lg shadow transition';
        alert('Practice Drill Series Completed!');
      } else {
        totalSeconds = customSegmentMins * 60;
      }
      updateTimerDisplay();
      renderContent();
    }

    function resetTimer() {
      clearInterval(timerInterval);
      isRunning = false;
      totalSeconds = customSegmentMins * 60;
      document.getElementById('start-pause-btn').textContent = 'Start';
      document.getElementById('start-pause-btn').className = 'bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold px-4 py-1.5 rounded-lg shadow transition';
      updateTimerDisplay();
    }

    function adjustTime(mins) {
      totalSeconds += mins * 60;
      if (totalSeconds < 0) totalSeconds = 0;
      updateTimerDisplay();
    }

    function changeDrillSegment(direction) {
      currentActiveIndex = (currentActiveIndex + direction + originalDrills.length) % originalDrills.length;
      totalSeconds = customSegmentMins * 60;
      updateTimerDisplay();
      renderContent();
    }

    function jumpToDrill(originalIndex) {
      currentActiveIndex = originalIndex;
      totalSeconds = customSegmentMins * 60;
      updateTimerDisplay();
      renderContent();
    }

    loadData();
  </script>
</body>
</html>
