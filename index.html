<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Baseball Practice Drill Series</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
  <div class="max-w-4xl mx-auto p-4 sm:p-6">
    <!-- Header -->
    <header class="bg-slate-900 border border-slate-800 text-white p-6 rounded-2xl shadow-xl mb-6">
      <div class="flex items-center justify-between flex-wrap gap-4">
        <div>
          <h1 class="text-2xl sm:text-3xl font-extrabold tracking-tight flex items-center gap-2">
            <span>⚾</span> Practice Drill Series Tracker
          </h1>
          <p class="text-slate-400 text-sm mt-1">Manage practice flow, segment times, and coach responsibilities.</p>
        </div>
      </div>
    </header>

    <!-- Filter Buttons -->
    <div class="flex flex-wrap gap-2 mb-6">
      <button onclick="filterDrills('All')" class="filter-btn bg-emerald-600 text-white px-4 py-2 rounded-xl text-sm font-semibold shadow hover:bg-emerald-500 transition">All Drills</button>
      <button onclick="filterDrills('Pitching Coach')" class="filter-btn bg-slate-900 text-slate-300 border border-slate-800 px-4 py-2 rounded-xl text-sm font-semibold shadow-sm hover:bg-slate-800 transition">Pitching Coach</button>
      <button onclick="filterDrills('Catching Coach')" class="filter-btn bg-slate-900 text-slate-300 border border-slate-800 px-4 py-2 rounded-xl text-sm font-semibold shadow-sm hover:bg-slate-800 transition">Catching Coach</button>
      <button onclick="filterDrills('Infield Coach')" class="filter-btn bg-slate-900 text-slate-300 border border-slate-800 px-4 py-2 rounded-xl text-sm font-semibold shadow-sm hover:bg-slate-800 transition">Infield Coach</button>
      <button onclick="filterDrills('Outfield')" class="filter-btn bg-slate-900 text-slate-300 border border-slate-800 px-4 py-2 rounded-xl text-sm font-semibold shadow-sm hover:bg-slate-800 transition">Outfield</button>
    </div>

    <!-- Drills Container -->
    <div id="drills-container" class="space-y-4">
      <!-- Dynamically populated -->
    </div>
  </div>

  <script>
    let drillData = [];

    async function loadData() {
      const response = await fetch('data.json');
      const data = await response.json();
      drillData = data.drills;
      renderDrills(drillData);
    }

    function renderDrills(drills, filterCoach = 'All') {
      const container = document.getElementById('drills-container');
      container.innerHTML = '';

      drills.forEach(drillBlock => {
        const filteredTasks = drillBlock.tasks.filter(t => {
          if (filterCoach === 'All') return true;
          return t.coach.toLowerCase().includes(filterCoach.toLowerCase());
        });

        if (filteredTasks.length === 0) return;

        const card = document.createElement('div');
        card.className = 'bg-slate-900 border border-slate-800 rounded-2xl shadow-lg p-5';

        let tasksHtml = filteredTasks.map((t, idx) => `
          <div class="flex items-start justify-between py-3.5 ${idx !== filteredTasks.length - 1 ? 'border-b border-slate-800' : ''}">
            <div class="flex items-start space-x-3.5 w-full">
              <input type="checkbox" class="mt-1 h-5 w-5 rounded border-slate-700 bg-slate-800 text-emerald-500 focus:ring-emerald-500 cursor-pointer">
              <div class="flex-1">
                <div class="flex flex-wrap items-center justify-between gap-2">
                  <div class="flex items-center space-x-2">
                    <span class="bg-slate-800 text-slate-300 border border-slate-700 text-xs font-bold px-2.5 py-0.5 rounded-md">${t.position}</span>
                    <span class="text-xs text-emerald-400 font-semibold">Lead: ${t.coach}</span>
                  </div>
                  <span class="bg-slate-800/80 text-amber-400 border border-slate-700/60 text-xs font-mono font-bold px-2.5 py-0.5 rounded-md flex items-center gap-1">
                    ⏱️ Segment: ${t.segmentTime}
                  </span>
                </div>
                <h4 class="font-semibold text-slate-100 mt-1.5">${t.drill}</h4>
                <p class="text-sm text-slate-400 mt-0.5 leading-relaxed">${t.description}</p>
              </div>
            </div>
          </div>
        `).join('');

        card.innerHTML = `
          <div class="flex items-center justify-between mb-3 pb-2.5 border-b border-slate-800">
            <h3 class="text-lg font-bold text-emerald-400 tracking-wide">Drill ${drillBlock.drillNumber}</h3>
          </div>
          <div class="divide-y divide-slate-800">
            ${tasksHtml}
          </div>
        `;
        container.appendChild(card);
      });
    }

    function filterDrills(coachName) {
      document.querySelectorAll('.filter-btn').forEach(btn => {
        if(btn.textContent.includes(coachName) || (coachName === 'All' && btn.textContent === 'All Drills')) {
          btn.className = 'filter-btn bg-emerald-600 text-white px-4 py-2 rounded-xl text-sm font-semibold shadow hover:bg-emerald-500 transition';
        } else {
          btn.className = 'filter-btn bg-slate-900 text-slate-300 border border-slate-800 px-4 py-2 rounded-xl text-sm font-semibold shadow-sm hover:bg-slate-800 transition';
        }
      });
      renderDrills(drillData, coachName);
    }

    loadData();
  </script>
</body>
</html>
