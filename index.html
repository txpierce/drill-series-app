<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Baseball Practice Drill Series</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800">
  <div class="max-w-4xl mx-auto p-4 sm:p-6">
    <!-- Header -->
    <header class="bg-blue-900 text-white p-6 rounded-xl shadow-md mb-6">
      <h1 class="text-2xl sm:text-3xl font-bold">⚾ Practice Drill Series Tracker</h1>
      <p class="text-blue-200 text-sm mt-1">Manage practice flow, responsibilities, and drill descriptions.</p>
    </header>

    <!-- Filter Buttons -->
    <div class="flex flex-wrap gap-2 mb-6">
      <button onclick="filterDrills('All')" class="filter-btn bg-blue-600 text-white px-4 py-2 rounded-lg text-sm font-semibold shadow hover:bg-blue-700 transition">All Drills</button>
      <button onclick="filterDrills('Pitching Coach')" class="filter-btn bg-white text-slate-700 border border-slate-300 px-4 py-2 rounded-lg text-sm font-semibold shadow-sm hover:bg-slate-50 transition">Pitching Coach</button>
      <button onclick="filterDrills('Catching Coach')" class="filter-btn bg-white text-slate-700 border border-slate-300 px-4 py-2 rounded-lg text-sm font-semibold shadow-sm hover:bg-slate-50 transition">Catching Coach</button>
      <button onclick="filterDrills('Infield Coach')" class="filter-btn bg-white text-slate-700 border border-slate-300 px-4 py-2 rounded-lg text-sm font-semibold shadow-sm hover:bg-slate-50 transition">Infield Coach</button>
      <button onclick="filterDrills('Outfield')" class="filter-btn bg-white text-slate-700 border border-slate-300 px-4 py-2 rounded-lg text-sm font-semibold shadow-sm hover:bg-slate-50 transition">Outfield</button>
    </div>

    <!-- Drills Container -->
    <div id="drills-container" class="space-y-4">
      <!-- Dynamically populated -->
    </div>
  </div>

  <script>
    let drillData = [];

    async function loadData() {
      const response = await fetch('data.json');
      const data = await response.json();
      drillData = data.drills;
      renderDrills(drillData);
    }

    function renderDrills(drills, filterCoach = 'All') {
      const container = document.getElementById('drills-container');
      container.innerHTML = '';

      drills.forEach(drillBlock => {
        const filteredTasks = drillBlock.tasks.filter(t => {
          if (filterCoach === 'All') return true;
          return t.coach.toLowerCase().includes(filterCoach.toLowerCase());
        });

        if (filteredTasks.length === 0) return;

        const card = document.createElement('div');
        card.className = 'bg-white rounded-xl shadow-sm border border-slate-200 p-5';

        let tasksHtml = filteredTasks.map((t, idx) => `
          <div class="flex items-start justify-between py-3 ${idx !== filteredTasks.length - 1 ? 'border-b border-slate-100' : ''}">
            <div class="flex items-start space-x-3">
              <input type="checkbox" class="mt-1 h-5 w-5 rounded border-slate-300 text-blue-600 focus:ring-blue-500">
              <div>
                <div class="flex items-center space-x-2">
                  <span class="bg-slate-100 text-slate-700 text-xs font-bold px-2 py-0.5 rounded">${t.position}</span>
                  <span class="text-xs text-blue-600 font-semibold">Lead: ${t.coach}</span>
                </div>
                <h4 class="font-semibold text-slate-900 mt-1">${t.drill}</h4>
                <p class="text-sm text-slate-600 mt-0.5">${t.description}</p>
              </div>
            </div>
          </div>
        `).join('');

        card.innerHTML = `
          <div class="flex items-center justify-between mb-3 pb-2 border-b border-slate-200">
            <h3 class="text-lg font-bold text-blue-900">Drill ${drillBlock.drillNumber}</h3>
          </div>
          <div class="divide-y divide-slate-100">
            ${tasksHtml}
          </div>
        `;
        container.appendChild(card);
      });
    }

    function filterDrills(coachName) {
      document.querySelectorAll('.filter-btn').forEach(btn => {
        if(btn.textContent.includes(coachName) || (coachName === 'All' && btn.textContent === 'All Drills')) {
          btn.className = 'filter-btn bg-blue-600 text-white px-4 py-2 rounded-lg text-sm font-semibold shadow hover:bg-blue-700 transition';
        } else {
          btn.className = 'filter-btn bg-white text-slate-700 border border-slate-300 px-4 py-2 rounded-lg text-sm font-semibold shadow-sm hover:bg-slate-50 transition';
        }
      });
      renderDrills(drillData, coachName);
    }

    loadData();
  </script>
</body>
</html>
